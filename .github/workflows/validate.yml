name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # version の確認で main と比べるため、履歴をすべて取得する
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.251

      - name: Validate skills and plugin definitions
        env:
          # PR では PR の向き先（main）と比べる。main への push では version の確認を飛ばす
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'none' }}
        run: bash scripts/validate.sh

      # PR のタイトル・本文にも社内情報が入っていないか確認する
      - name: Check PR title and body for internal information
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr" && cd "$RUNNER_TEMP/pr" && git init -q
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > pr.txt
          mkdir -p scripts && cp "$GITHUB_WORKSPACE/scripts/check-internal-info.sh" scripts/
          bash scripts/check-internal-info.sh
